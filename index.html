<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MindGuard · 마음 지킴이</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/splash.css" />
</head>
<body>
  <div class="shell">
    <div class="bg-layer">
      <div class="grid-lines"></div>
      <div class="glow-center"></div>
      <div class="glow-top"></div>
      <div class="glow-bot"></div>
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <div class="ring ring3"></div>
      <div class="particles" id="particles"></div>
    </div>

    <div class="status-bar">
      <span class="status-city">DAEGU · 2025</span>
      <div class="ondevice-pill"><span class="pulse-dot"></span>ON-DEVICE</div>
    </div>

    <div class="daegu-badge">대구 바이브 코딩 대회</div>

    <div class="hero">
      <div class="logo-mark">
        <div class="logo-ring-outer"></div>
        <div class="logo-ring-inner"></div>
        <div class="logo-core"><span class="logo-icon">🌿</span></div>
        <div class="logo-dot-outer"></div>
      </div>
      <div class="app-name"><span class="highlight">MindGuard</span></div>
      <div class="app-name-kr">마음 지킴이</div>
      <p class="tagline">
        <strong>행동 패턴</strong>과 <strong>자가 진단</strong>으로<br>
        당신의 마음 변화를 조기에 감지하고<br>
        대구 지역 상담 자원을 연결합니다
      </p>
      <div class="feature-pills">
        <div class="pill"><div class="pill-dot" style="background:#2dd4bf"></div>온디바이스 AI</div>
        <div class="pill"><div class="pill-dot" style="background:#818cf8"></div>앱 패턴 분석</div>
        <div class="pill"><div class="pill-dot" style="background:#f472b6"></div>자가 진단</div>
        <div class="pill"><div class="pill-dot" style="background:#fb923c"></div>상담 연결</div>
      </div>
    </div>

    <div class="bottom-area">
      <a href="pages/check.html" class="cta-btn">
        마음 체크 시작하기
        <div class="cta-btn-sub">약 3분 소요 · 완전 무료</div>
      </a>
      <a href="pages/pattern.html" class="secondary-btn">앱 사용 패턴으로 분석하기</a>
      <div class="privacy-note">
        <span>🔒</span>
        모든 데이터는 이 기기 안에서만 처리됩니다. 외부 서버 전송 없음.
      </div>
      <div class="version-tag">v1.0.0 · BOWEN / MENTAL HEALTH · KYUNGPOOK</div>
    </div>
  </div>

  <script src="js/splash.js"></script>
</body>
</html>
